<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} — GymTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #F8F7FC;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .scene {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px 48px;
      background: linear-gradient(165deg, #F8F7FC 0%, #EEE9FF 45%, #F8F7FC 100%);
      box-sizing: border-box;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .blob-1 {
      width: 240px;
      height: 240px;
      top: -60px;
      right: -50px;
      background: radial-gradient(circle, rgba(117, 44, 210, 0.16) 0%, transparent 70%);
    }
    .blob-2 {
      width: 180px;
      height: 180px;
      bottom: 40px;
      left: -50px;
      background: radial-gradient(circle, rgba(0, 120, 227, 0.1) 0%, transparent 70%);
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 22px;
      padding: 36px 28px 32px;
      text-align: center;
      box-shadow:
        0 4px 6px rgba(25, 10, 61, 0.04),
        0 16px 40px rgba(117, 44, 210, 0.1);
      border: 1px solid rgba(117, 44, 210, 0.06);
    }
    .logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #752CD2;
      margin-bottom: 24px;
    }
    .icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      margin: 0 auto 20px;
      line-height: 0;
    }
    .icon-badge svg {
      display: block;
      width: 36px;
      height: 36px;
    }
    .icon-badge--ok {
      background: rgba(0, 186, 0, 0.12);
      border: 1px solid rgba(0, 186, 0, 0.2);
    }
    .icon-badge--err {
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.18);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #11142D;
      margin: 0 0 12px;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      line-height: 1.65;
      color: #64748b;
      margin: 0;
    }
    .footer-note {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="wrap">
      <div class="logo">GymTracker</div>
      <div class="icon-badge icon-badge--{{ status }}" aria-hidden="true">
        {{ icon_svg }}
      </div>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
    </div>

    <p class="footer-note">GymTracker · трекер тренировок</p>
  </div>
</body>
</html>
