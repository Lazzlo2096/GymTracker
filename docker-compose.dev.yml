# Docker Compose — среда разработки
# Запуск: docker compose -f docker-compose.dev.yml up -d
# Миграции PostgreSQL: сервис db-migrate выполняет `alembic upgrade head` после готовности postgres,
#   затем стартует backend (depends_on: service_completed_successfully).
# pgAdmin: http://localhost:5050 (логин/пароль — PGADMIN_EMAIL / PGADMIN_PASSWORD или значения по умолчанию в compose).
#   Сервер БД подставляется из docker/pgadmin/servers.json (первый запуск тома pgadmin_data_dev).

services:

  # PostgreSQL (auth, workouts)
  postgres:
    image: postgres:16-alpine
    container_name: gymtracker_postgres_dev
    networks:
      - devnet
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymtracker
    ports:
      - "5437:5432"   # 5437 на хосте (5433–5436 часто заняты другими compose)
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Alembic: применяет миграции к PostgreSQL и завершается (один раз за `compose up`).
  # Подключение напрямую к postgres:5432 (не через PgBouncer — корректнее для DDL).
  db-migrate:
    networks:
      - devnet
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: gymtracker_db_migrate_dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gymtracker
    volumes:
      - ./backend:/app
    command: ["python", "-m", "alembic", "upgrade", "head"]

  # PgBouncer (пул соединений к PostgreSQL)
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: gymtracker_pgbouncer_dev
    restart: unless-stopped
    networks:
      - devnet
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6437:6432"   # 6437 на хосте (6432–6436 часто заняты)
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres -d gymtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # pgAdmin (веб-UI для PostgreSQL). Преднастроенное подключение: docker/pgadmin/servers.json
  # (Host: postgres, порт 5432 внутри сети compose). Пароль БД должен совпадать с POSTGRES_PASSWORD.
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: gymtracker_pgadmin_dev
    restart: unless-stopped
    networks:
      - devnet
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

  # Плановые push (напоминания, стрики, привычное время) — каждые 5 мин
  notification-jobs:
    networks:
      - devnet
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: gymtracker_notification_jobs_dev
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:6432/gymtracker
    volumes:
      - ./backend:/app
    command:
      [
        "sh",
        "-c",
        "while true; do python scripts/run_notification_jobs.py || true; sleep 300; done",
      ]

  # MailDev — перехват исходящей почты (SMTP :1025, UI :1080)
  maildev:
    image: maildev/maildev:2.1.0
    container_name: gymtracker_maildev_dev
    restart: unless-stopped
    networks:
      - devnet
    ports:
      - "1080:1080"
      - "1025:1025"
    command: ["bin/maildev", "--web", "1080", "--smtp", "1025"]

  # Бэкенд (--reload при изменении кода)
  backend:
    networks:
      - devnet
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: gymtracker_backend_dev
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis_container:
        condition: service_healthy
      maildev:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:6432/gymtracker
      AUTH_SECRET: ${AUTH_SECRET:-gymtracker-dev-auth-secret-min-32-chars-change-in-prod}
      ACCESS_TTL_MINUTES: ${ACCESS_TTL_MINUTES:-15}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # CORS: из корневого .env или дефолт — localhost + LAN (телефон / Expo web в Wi‑Fi)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1|\[::1\]|192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3})(:\d+)?$$}
      REDIS_HOST: redis_container
      REDIS_PORT: "6379"
      SMTP_HOST: ${SMTP_HOST:-maildev}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@habitpro.ru}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:8000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5); exit(0 if 200 <= r.status < 300 else 1)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: gymtracker_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - devnet

  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROMETHEUS_CONTAINER_NAME:-gymtracker_prometheus_dev}
    networks:
      - devnet
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus_data/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: ${GRAFANA_CONTAINER_NAME:-gymtracker_grafana_dev}
    networks:
      - devnet
    ports:
      # 3001 на хосте: 3000 часто занят Expo
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
  
  redis_container:
    image: redis:7-alpine
    container_name: gymtracker_redis_dev
    restart: unless-stopped
    networks:
      - devnet
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  redis_gui:
    image: redis/redisinsight:latest
    container_name: gymtracker_redis_gui_dev
    restart: unless-stopped
    networks:
      - devnet
    ports:
      - "${REDIS_GUI_PORT:-5540}:5540"
    environment:
      RI_APP_HOST: "0.0.0.0"
      RI_APP_PORT: "5540"
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_LOG_LEVEL: warn
      RI_PROXY_PATH: /redis
      RI_TRUSTEDORIGINS: http://localhost:5540,http://127.0.0.1:5540
      RI_REDIS_HOST: redis_container
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: gymtracker
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis_container:
        condition: service_healthy


networks:
  devnet:
    driver: bridge

volumes:
  postgres_data_dev:
  pgadmin_data_dev:
  grafana_data:
  redis_insight_data:
