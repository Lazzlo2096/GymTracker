# Docker Compose — псевдо-prod (демо / habitpro.ru)
#
# Подготовка на сервере:
#   ./deploy/prod/bootstrap.sh             # или generate-env.sh + up.sh
#   ./deploy/prod/certbot-init.sh          # Let's Encrypt → HTTPS
#
# Снаружи (интернет):
#   :80 / :443  — mobile-web + API (habitpro.ru)
#   /tools/ /pgadmin/ /grafana/ /prometheus/ — панели (HTTPS, порт 443)
#   :9000       — редирект на 443 (обратная совместимость)
#
# postgres, pgbouncer — только внутри Docker-сети

name: gymtracker-prod

services:

  postgres:
    image: postgres:16-alpine
    container_name: gymtracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymtracker_db_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - internal

  # Опционально (профиль pooler). Backend ходит в postgres напрямую — меньше сбоев auth на малых VPS.
  pgbouncer:
    profiles:
      - pooler
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: gymtracker_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.prod.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 6432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev:2.1.0
    container_name: gymtracker_maildev
    restart: unless-stopped
    networks:
      - internal
    command:
      [
        "bin/maildev",
        "--web",
        "1080",
        "--smtp",
        "1025",
        "--base-pathname",
        "/maildev",
      ]

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: gymtracker_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set in .env.prod}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set in .env.prod}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.prod.json:/pgadmin4/servers.json:ro
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    container_name: gymtracker_prometheus
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./prometheus_data/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.route-prefix=/prometheus/
      - --web.external-url=${MONITORING_PUBLIC_URL:-https://habitpro.ru}/prometheus/
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: gymtracker_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # ROOT_URL должен совпадать с URL в браузере (https://habitpro.ru/grafana/).
      # GF_SERVER_DOMAIN не задаём — иначе HTTP 400 при www или смене host.
      # Снаружи HTTPS (nginx), внутри контейнера — HTTP :3000. Не задавать GF_SERVER_PROTOCOL=https.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://habitpro.ru/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ENFORCE_DOMAIN: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env.prod}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymtracker_backend
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis_container:
        condition: service_healthy
      maildev:
        condition: service_started
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env.prod}
      ACCESS_TTL_MINUTES: ${ACCESS_TTL_MINUTES:-15}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-}
      REDIS_HOST: redis_container
      REDIS_PORT: "6379"
      SMTP_HOST: ${SMTP_HOST:-maildev}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@habitpro.ru}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-0}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-0}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://habitpro.ru}
    volumes:
      - backend_media:/app/media
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5); exit(0 if 200 <= r.status < 300 else 1)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  mobile-web:
    build:
      context: .
      dockerfile: mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
    container_name: gymtracker_mobile_web
    restart: unless-stopped
    networks:
      - internal
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    image: nginx:alpine
    container_name: gymtracker_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "9000:9000"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.prod.bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_MONITORING_CONF:-./nginx/nginx.prod.monitoring.bootstrap.conf}:/etc/nginx/conf.d/monitoring.conf:ro
      - ./nginx/nginx.prod.tools-upstreams.conf:/etc/nginx/conf.d/tools-upstreams.conf:ro
      - ./nginx/nginx.prod.tools.inc:/etc/nginx/conf.d/nginx.prod.tools.inc:ro
      - ./nginx/monitoring-index.html:/usr/share/nginx/monitoring/index.html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - mobile-web
      - backend
      - pgadmin
      - grafana
      - prometheus
      - redis_gui
      - maildev
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    container_name: gymtracker_certbot
    profiles:
      - certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $!; done;'"
    depends_on:
      - nginx

  redis_container:
    image: redis:7-alpine
    container_name: gymtracker_redis
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  redis_gui:
    image: redis/redisinsight:latest
    container_name: gymtracker_redis_gui
    restart: unless-stopped
    networks:
      - internal
    # Прямой доступ с хоста: http://localhost:${REDIS_GUI_PORT:-5540}/redis/
    ports:
      - "${REDIS_GUI_PORT:-5540}:5540"
    environment:
      RI_APP_HOST: "0.0.0.0"
      RI_APP_PORT: "5540"
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_LOG_LEVEL: warn
      # Подпуть за nginx (/redis/) — без path-rewrite, см. nginx.prod.tools.inc
      RI_PROXY_PATH: /redis
      RI_TRUSTEDORIGINS: ${RI_TRUSTEDORIGINS:-${MONITORING_PUBLIC_URL:-https://habitpro.ru}}
      RI_REDIS_HOST: redis_container
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: gymtracker
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis_container:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:5540/redis/ 2>/dev/null || curl -fsS http://127.0.0.1:5540/redis/ >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  grafana_data:
  backend_media:
  certbot_www:
  certbot_certs:
  redis_insight_data:
