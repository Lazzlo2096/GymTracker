[databases]
gymtracker = host=postgres port=5432 dbname=gymtracker

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# Нужен plain, чтобы PgBouncer мог логиниться в Postgres с SCRAM
# (иначе будет: cannot do SCRAM authentication: wrong password type)
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 500
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 5

ignore_startup_parameters = extra_float_digits

log_connections = 1
log_disconnections = 1
verbose = 0
