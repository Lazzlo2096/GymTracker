# Nginx — псевдо-prod, фаза 1 (HTTP, получение Let's Encrypt).
# После certbot-init переключите NGINX_CONF на nginx/nginx.prod.conf в .env.prod

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream mobile_web {
    server mobile-web:80;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name habitpro.ru www.habitpro.ru _;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    set $tools_proxy_scheme $scheme;
    set $tools_redirect_scheme $scheme;

    include /etc/nginx/conf.d/nginx.prod.tools.inc;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://mobile_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }
}
