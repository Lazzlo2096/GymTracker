# Nginx — псевдо-prod, фаза 2 (HTTPS + редирект с HTTP).
# Требует сертификаты в volume certbot_certs (deploy/prod/certbot-init.sh).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream mobile_web {
    server mobile-web:80;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name www.habitpro.ru;
    return 301 https://habitpro.ru$request_uri;
}

server {
    listen 80;
    server_name habitpro.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://habitpro.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.habitpro.ru;
    ssl_certificate /etc/letsencrypt/live/habitpro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habitpro.ru/privkey.pem;
    return 301 https://habitpro.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name habitpro.ru;

    ssl_certificate /etc/letsencrypt/live/habitpro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habitpro.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    set $tools_proxy_scheme https;
    set $tools_redirect_scheme https;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/conf.d/nginx.prod.tools.inc;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://mobile_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
    }
}
